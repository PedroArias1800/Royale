<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Royale Panama — Nuevo Pedido</title>
    <style>
        /* Reset */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; display: block; }

        body {
            margin: 0;
            padding: 0;
            background-color: #0d0810;
            font-family: Georgia, 'Times New Roman', serif;
            color: #ede8eb;
        }

        .wrapper {
            width: 100%;
            background-color: #0d0810;
            padding: 32px 0;
        }

        .email-container {
            max-width: 580px;
            margin: 0 auto;
            background-color: #130c11;
            border: 1px solid rgba(253, 208, 94, 0.18);
        }

        /* ── Header ── */
        .email-header {
            background: linear-gradient(135deg, #1a0515 0%, #2a0820 50%, #1a0515 100%);
            border-bottom: 2px solid #d60a5f;
            padding: 28px 36px;
            text-align: center;
        }
        .email-header img {
            height: 54px;
            margin: 0 auto 14px;
            display: block;
        }
        .email-header .header-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }
        .email-header .header-line {
            flex: 1;
            max-width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(253,208,94,0.45), transparent);
            display: inline-block;
        }
        .email-header .header-gem {
            color: rgba(253, 208, 94, 0.6);
            font-size: 10px;
            letter-spacing: 0.3em;
        }
        .email-header h1 {
            margin: 0;
            font-size: 11px;
            font-family: Arial, sans-serif;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(253, 208, 94, 0.7);
            font-weight: normal;
        }

        /* ── Saludo ── */
        .email-greeting {
            padding: 28px 36px 0;
            border-bottom: 1px solid rgba(253, 208, 94, 0.08);
        }
        .email-greeting p {
            margin: 0 0 18px;
            font-size: 15px;
            line-height: 1.6;
            color: rgba(237, 232, 235, 0.82);
        }
        .email-greeting .cliente-name {
            color: #fdd05e;
            font-style: italic;
        }

        /* ── Badge nuevo pedido ── */
        .pedido-badge {
            display: inline-block;
            background: linear-gradient(135deg, #7d0532, #d60a5f);
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            padding: 5px 16px;
            margin: 0 36px 24px;
        }

        /* ── Body del mensaje ── */
        .email-body {
            padding: 24px 36px 28px;
        }
        .email-body .message-block {
            background-color: #1c1119;
            border-left: 3px solid #d60a5f;
            padding: 18px 20px;
            font-size: 14px;
            line-height: 1.75;
            color: rgba(237, 232, 235, 0.9);
            white-space: pre-line;
        }
        .email-body .gracias {
            margin: 20px 0 0;
            font-size: 14px;
            color: rgba(237, 232, 235, 0.6);
            text-align: center;
            font-style: italic;
            letter-spacing: 0.04em;
        }

        /* ── Separator ── */
        .separator {
            display: flex;
            align-items: center;
            margin: 0 36px;
            gap: 12px;
        }
        .sep-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(253,208,94,0.2), transparent);
        }
        .sep-gem {
            color: rgba(253, 208, 94, 0.35);
            font-size: 9px;
            letter-spacing: 0.4em;
        }

        /* ── Footer ── */
        .email-footer {
            background-color: #0d0810;
            border-top: 1px solid rgba(253, 208, 94, 0.1);
            padding: 28px 36px 32px;
            text-align: center;
        }
        .email-footer img.footer-logo {
            height: 42px;
            margin: 0 auto 20px;
            display: block;
            opacity: 0.85;
        }

        /* Redes Sociales */
        .social-title {
            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(253, 208, 94, 0.45);
            margin: 0 0 14px;
        }
        .social-links {
            margin-bottom: 20px;
        }
        .social-link {
            display: inline-block;
            margin: 0 10px;
            text-decoration: none;
            color: rgba(237, 232, 235, 0.65);
            font-family: Arial, sans-serif;
            font-size: 12px;
            vertical-align: middle;
        }
        .social-link img {
            display: inline-block;
            vertical-align: middle;
            margin-right: 5px;
            width: 18px;
            height: 18px;
        }
        .social-link:hover { color: #fdd05e; }

        /* Contacto */
        .contact-block {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(253, 208, 94, 0.07);
        }
        .contact-block a {
            color: rgba(253, 208, 94, 0.55);
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 0.04em;
        }
        .copyright {
            margin-top: 18px;
            font-family: Arial, sans-serif;
            font-size: 10px;
            color: rgba(237, 232, 235, 0.22);
            letter-spacing: 0.06em;
        }
    </style>

    {{message}}  → detalle del pedido (texto con saltos de línea)

  IMPORTANTE: Copiar el HTML completo de arriba (desde <!DOCTYPE html>

  Asegurarse de que el campo sea tipo "HTML" (no "Text").

  El campo {{message}} usa white-space: pre-line para respetar
  los saltos de línea del texto plano enviado desde CartResume.jsx.
